<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>MiCine · Mi lista</title>

		<!-- Bootstrap 5.3 + íconos -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

		<!-- Fuente y colores -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" />
		<link rel="stylesheet" href="styles.css" />

		<script src="app.js" defer></script>
	</head>

	<body>
		<!-- Oculto hasta que JS confirme que hay sesión -->
		<main id="app" class="container d-none">
			<div class="row justify-content-center">
				<div class="col-12 col-sm-8 col-md-6 col-lg-4 py-4 d-flex flex-column gap-3">

					<!-- Encabezado -->
					<header class="d-flex align-items-center gap-2">
						<div class="me-auto">
							<p id="saludo" class="small text-body-secondary mb-0"></p>
							<h1 class="h5 fw-semibold mb-0">¿Qué viste hoy?</h1>
						</div>
						<span id="iniciales" class="badge rounded-circle text-bg-primary fs-6 p-2"></span>
						<button id="btn-salir" type="button" class="btn btn-link link-primary fs-4 p-1" aria-label="Cerrar sesión">
							<i class="bi bi-box-arrow-right"></i>
						</button>
					</header>

					<!-- Agregar película o serie -->
					<form id="form-agregar" class="card bg-body-secondary border-0 rounded-4" novalidate>
						<div class="card-body d-flex flex-column gap-2">
							<h2 class="h6 fw-semibold mb-1">Agregar</h2>

							<div class="btn-group w-100" role="group" aria-label="Tipo">
								<input type="radio" class="btn-check" name="tipo" id="tipo-pelicula" value="pelicula" checked />
								<label class="btn btn-outline-primary" for="tipo-pelicula"><i class="bi bi-film"></i> Película</label>
								<input type="radio" class="btn-check" name="tipo" id="tipo-serie" value="serie" />
								<label class="btn btn-outline-primary" for="tipo-serie"><i class="bi bi-tv"></i> Serie</label>
							</div>

							<div>
								<input id="input-titulo" type="text" class="form-control" placeholder="Título" />
								<div class="invalid-feedback">Escribí el título.</div>
							</div>

							<!-- Chips de género: los crea JS -->
							<div id="lista-generos" class="d-flex flex-wrap gap-2"></div>

							<div class="d-flex align-items-center justify-content-between">
								<!-- Estrellas: las crea JS -->
								<div id="estrellas" class="d-flex gap-1"></div>
								<button type="submit" class="btn btn-primary rounded-circle fs-5 lh-1 p-2" aria-label="Guardar">
									<i class="bi bi-plus-lg"></i>
								</button>
							</div>
							<p id="error-puntaje" class="small text-danger mb-0 d-none">Elegí cuántas estrellas le das.</p>
						</div>
					</form>

					<!-- Título de la lista -->
					<div class="d-flex align-items-center justify-content-between">
						<h2 class="h6 fw-semibold mb-0">Mi lista <span id="contador" class="small fw-normal text-body-secondary"></span></h2>
						<button id="btn-limpiar" type="button" class="btn btn-link link-primary text-decoration-none btn-sm p-0">
							<i class="bi bi-trash"></i> Limpiar
						</button>
					</div>

					<!-- Filtros: los crea JS -->
					<div id="filtros" class="btn-group w-100" role="group" aria-label="Filtrar"></div>

					<!-- Grilla: la crea JS -->
					<div id="grilla" class="row row-cols-2 g-2"></div>
					<p id="mensaje-vacio" class="text-center text-body-secondary small py-4 d-none">Tu lista está vacía. Agregá tu primera película o serie.</p>

				</div>
			</div>
		</main>
		<script src="app.js"></script>
	</body>
</html>
