<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title> Ingresar </title>

		<!-- Bootstrap 5.3 + íconos -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

		<!-- Fuente y colores -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" />
		<link rel="stylesheet" href="styles.css" />

	</head>
	<body>
		<main class="container">
			<div class="row justify-content-center">
				<div class="col-12 col-sm-8 col-md-6 col-lg-4 d-flex flex-column min-vh-100 py-5">

					<!-- Logo y título -->
					<div class="d-inline-flex align-self-start bg-primary text-dark rounded-4 p-3 fs-2 lh-1">
						<i class="bi bi-film"></i>
					</div>
					<h1 class="display-6 fw-semibold mt-4 mb-1">Tu cine,<br />tus <span class="text-primary">estrellas</span>.</h1>
					<p class="text-body-secondary">Lo viste, puntualo.</p>

					<!-- Formulario -->
					<form id="form-login" class="d-flex flex-column flex-grow-1 mt-4" novalidate>
						<div class="mb-3">
							<label for="login-usuario" class="form-label small text-body-secondary">Usuario</label>
							<div class="input-group input-group-lg has-validation">
								<span class="input-group-text"><i class="bi bi-person"></i></span>
								<input id="login-usuario" type="text" class="form-control" placeholder="Tu usuario" autocomplete="username" />
								<div class="invalid-feedback">Completá tu usuario.</div>
							</div>
						</div>

						<div class="mb-3">
							<label for="login-pass" class="form-label small text-body-secondary">Contraseña</label>
							<div class="input-group input-group-lg has-validation">
								<span class="input-group-text"><i class="bi bi-lock"></i></span>
								<input id="login-pass" type="password" class="form-control" placeholder="Tu contraseña" />
								<button id="btn-ver-pass" class="btn btn-outline-primary" type="button" aria-label="Mostrar contraseña">
									<i class="bi bi-eye"></i>
								</button>
								<div class="invalid-feedback">Completá tu contraseña.</div>
							</div>
						</div>

						<div class="mt-auto">
							<button type="submit" class="btn btn-primary btn-lg w-100 rounded-4 py-3 fw-semibold">
								Entrar a la sala <i class="bi bi-arrow-right"></i>
							</button>
						</div>
					</form>

				</div>
			</div>
		</main>
		<script src="login.js"></script>
	</head>
	</body>
</html>
